[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dynamicrags"
version = "0.0.1"
description = "A practical development project on Dynamic RAG for conversational QA. The project first focuses on evaluating Dynamic RAG methods on public datasets like 2Wiki and HotpotQA, then applies and tests these techniques on custom data collected to help the Montreal community find relevant social services."
authors = [
  { name = "Oumnia Boudersa" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.9.0"


[tool.ruff]
line-length = 99
src = ["dynamicrags"]
include = ["pyproject.toml", "dynamicrags/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["dynamicrags"]
force-sort-within-sections = true

